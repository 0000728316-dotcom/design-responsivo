<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>CyberStrike</title>
</head>

<body>
    <div class="principal">
        <main class="main">
            <span class="title"> ⚡TEMPORADA 04 ATIVA</span>
            <h1 class="h1">CyberStrike: Arena do Futuro</h1>
            <p class="paragrafo">Monte seu esquedrão cibernético,
                dispute torneios semanais e domine os sevidores
                de alta persormance com taxas de 144sps e premiações excluisivas.</p>

            <div class="baloes">
                <span class="balao">🛡️ Anti-Cheats</span>
                <span class="balao">⚡128 tick </span>
                <span class="balao">🏆 Ranqueado</span>
            </div>

            <div class="botao">
                <button type="button">JOGAR AGORA ⚔️</button>
            </div>

            <div class="img">
                <img src="imagens/bot.png" alt="imagem do bot da pagina">
            </div>

        </main>
    </div>
</body>

</html>
